[project]
name = "mw-sdk"
version = "0.7.0"
description = "Memory Workstation SDK — 纯数据引擎，零 LLM 依赖，Agent 进程内直连 MW 知识库读写记忆"
requires-python = ">=3.13,<3.14"
dependencies = [
    "watchdog>=4.0.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# C++ 高性引擎（搜索/图/向量加速）。不含 .pyd 编译产物，需按 cpp/README 编译。
cpp = [
    "pybind11>=2.11",
    "onnxruntime>=1.17",
]

[project.scripts]
mw = "mw_sdk.cli:main"

# SDK 自带的二进制/模型（若存在于源码树则一并打包）
[tool.setuptools.package-data]
mw_sdk = ["_core/*.pyd", "_core/*.dll", "_core/models/**/*"]

[tool.setuptools.packages.find]
include = ["mw_sdk*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
